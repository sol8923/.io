<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>코드 스니펫 무기 창고</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 20px; background-color: #f0f2f5; color: #333; }
    
    /* 헤더 */
    .header-area { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #ddd; }
    .header-area h1 { margin: 0; font-size: 24px; color: #343a40; display: flex; align-items: center; gap: 10px; }
    .header-btns { display: flex; gap: 10px; }
    .btn-setting { background: #6c757d; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; }
    .btn-setting:hover { background: #5a6268; }

    /* 레이아웃 */
    .main-container { display: flex; gap: 20px; align-items: flex-start; }
    
    /* 좌측: 입력 폼 */
    .form-section { width: 350px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); flex-shrink: 0; position: sticky; top: 20px; }
    .form-section h3 { margin-top: 0; color: #1a73e8; border-bottom: 1px dashed #eee; padding-bottom: 10px; }
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; font-size: 13px; font-weight: bold; color: #555; margin-bottom: 5px; }
    .input-group input, .input-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
    .input-group textarea { width: 100%; height: 250px; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: 'Consolas', monospace; font-size: 13px; background: #1e1e1e; color: #d4d4d4; resize: vertical; line-height: 1.4; }
    .input-group textarea:focus { outline: none; border-color: #1a73e8; }
    
    .btn-save { width: 100%; background: #1a73e8; color: white; border: none; padding: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px; transition: background 0.2s; }
    .btn-save:hover { background: #1557b0; }
    .btn-cancel { width: 100%; background: #6c757d; color: white; border: none; padding: 8px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px; margin-top: 5px; display: none; }

    /* 우측: 스니펫 리스트 */
    .list-section { flex: 1; min-width: 0; }
    
    /* 검색 및 필터 */
    .filter-bar { display: flex; gap: 10px; margin-bottom: 15px; background: white; padding: 12px 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .filter-bar input { flex: 1; padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    .filter-bar select { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-weight: bold; }

    /* 카드 그리드 */
    .snippet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 15px; }
    .snippet-card { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow: hidden; display: flex; flex-direction: column; border: 1px solid #e1e4e8; transition: transform 0.2s; }
    .snippet-card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    
    .card-header { padding: 12px 15px; background: #f8f9fa; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    .card-title { font-weight: bold; font-size: 15px; color: #333; margin: 0; display: flex; align-items: center; gap: 8px; }
    .category-badge { font-size: 11px; padding: 3px 8px; border-radius: 12px; color: white; font-weight: bold; }
    
    .card-body { padding: 0; position: relative; background: #1e1e1e; }
    .code-display { margin: 0; padding: 15px; font-family: 'Consolas', monospace; font-size: 13px; color: #d4d4d4; white-space: pre-wrap; word-break: break-all; max-height: 250px; overflow-y: auto; line-height: 1.5; }
    
    /* 코드 복사 버튼 */
    .btn-copy-code { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; transition: background 0.2s; backdrop-filter: blur(2px); }
    .btn-copy-code:hover { background: rgba(255,255,255,0.3); }
    .btn-copy-code.copied { background: #28a745; border-color: #28a745; }

    .card-footer { padding: 10px 15px; border-top: 1px solid #eee; display: flex; justify-content: flex-end; gap: 5px; background: white; }
    .btn-edit { background: #17a2b8; color: white; border: none; padding: 5px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold; }
    .btn-delete { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold; }

    /* 알림 토스트 */
    #toast { visibility: hidden; min-width: 250px; background-color: #28a745; color: #fff; text-align: center; border-radius: 4px; padding: 12px; position: fixed; z-index: 1000; left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 13px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
    @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
    @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }

    /* 모달 */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 25px; border-radius: 10px; width: 320px; display: flex; flex-direction: column; gap: 15px; }
    .modal-content h3 { margin: 0 0 5px 0; }
    .modal-content input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; margin-top: 3px; }
    .btn-group { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="header-area">
    <h1>💻 스니펫 무기 창고</h1>
    <div class="header-btns">
      <button class="btn-setting" onclick="openSettings()">⚙️ 동기화 설정</button>
    </div>
  </div>

  <div class="main-container">
    <!-- 좌측 코드 입력폼 -->
    <div class="form-section">
      <h3 id="form-title">새 스니펫 등록</h3>
      <div class="input-group">
        <label>제목 (어떤 기능인가요?)</label>
        <input type="text" id="snip-title" placeholder="예: TDMS 데이터 베이스라인 보정">
      </div>
      <div class="input-group">
        <label>카테고리</label>
        <select id="snip-category">
          <option value="VBA">Excel VBA</option>
          <option value="Spotfire">Spotfire</option>
          <option value="RPA">RPA (A360)</option>
          <option value="Python">Python</option>
          <option value="SQL">SQL</option>
          <option value="기타">기타 / 공통</option>
        </select>
      </div>
      <div class="input-group">
        <label>코드 내용</label>
        <textarea id="snip-code" placeholder="코드를 여기에 붙여넣으세요..."></textarea>
      </div>
      <button class="btn-save" id="btn-save" onclick="saveSnippet()">창고에 저장하기</button>
      <button class="btn-cancel" id="btn-cancel" onclick="cancelEdit()">수정 취소</button>
    </div>

    <!-- 우측 코드 리스트 -->
    <div class="list-section">
      <div class="filter-bar">
        <select id="filter-category" onchange="renderSnippets()">
          <option value="ALL">전체 카테고리 보기</option>
          <option value="VBA">Excel VBA</option>
          <option value="Spotfire">Spotfire</option>
          <option value="RPA">RPA (A360)</option>
          <option value="Python">Python</option>
          <option value="SQL">SQL</option>
          <option value="기타">기타 / 공통</option>
        </select>
        <input type="text" id="search-keyword" placeholder="제목이나 코드로 검색..." onkeyup="renderSnippets()">
      </div>
      
      <div class="snippet-grid" id="snippet-grid"></div>
    </div>
  </div>

  <!-- 토스트 알림 -->
  <div id="toast">복사 완료! (Ctrl+V)</div>

  <!-- 설정 모달 -->
  <div id="settings-modal" class="modal">
    <div class="modal-content">
      <h3 style="margin-top:0;">⚙️ 동기화 설정</h3>
      <div>
        <label style="font-size:12px; font-weight:bold; color:#555;">🔑 깃허브 관리자 토큰</label>
        <input type="password" id="github-token" placeholder="github_pat_..." oninput="localStorage.setItem('calendar_github_token', this.value)">
      </div>
      <p style="font-size:12px; color:#666; margin:0;">포털 내 다른 앱(달력/투두 등)과 토큰을 공유합니다.</p>
      <div class="btn-group">
        <button onclick="closeSettings()" style="background:#1a73e8; color:white; border:none; padding:8px 15px; border-radius:4px; font-weight:bold; cursor:pointer;">확인 및 갱신</button>
      </div>
    </div>
  </div>

  <script>
    const REPO = "sol8923/sh23.github.io";
    const FILE_PATH = "snippets.json"; 
    const API_URL = `https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`;
    const RAW_URL = `https://raw.githubusercontent.com/${REPO}/main/${FILE_PATH}`;

    let snippets = [];
    let fileSha = null;
    let editingId = null;

    // 카테고리별 테마 색상 (뱃지용)
    const categoryColors = {
      "VBA": "#207245",       // 엑셀 초록색
      "Spotfire": "#0085C3",  // 스팟파이어 파란색
      "RPA": "#FF6C00",       // 오렌지
      "Python": "#3776AB",    // 파이썬 블루
      "SQL": "#E38C00",       // 황토색
      "기타": "#6c757d"
    };

    const savedToken = localStorage.getItem("calendar_github_token");
    if (savedToken) document.getElementById("github-token").value = savedToken;

    // ----- 데이터 통신 -----
    async function fetchData() {
      let isLoaded = false;
      const token = document.getElementById("github-token").value;
      
      if (token) {
        try {
          const res = await fetch(API_URL + "?t=" + new Date().getTime(), { headers: { "Authorization": `token ${token}` } });
          if (res.ok) {
            const data = await res.json();
            fileSha = data.sha;
            snippets = JSON.parse(decodeURIComponent(escape(atob(data.content))));
            isLoaded = true;
          } else if (res.status === 404) {
            snippets = [];
            fileSha = null;
            isLoaded = true;
          }
        } catch (e) { console.error(e); }
      }

      if (!isLoaded) {
        try {
          const rawRes = await fetch(RAW_URL + "?t=" + new Date().getTime());
          if (rawRes.ok) snippets = await rawRes.json();
        } catch (e) { console.error(e); }
      }
      
      if (!Array.isArray(snippets)) snippets = [];
      renderSnippets();
    }

    async function syncToServer() {
      const token = document.getElementById("github-token").value;
      if (!token) { alert("동기화 토큰이 없습니다."); return false; }

      try {
        const res = await fetch(API_URL + "?t=" + new Date().getTime(), { headers: { "Authorization": `token ${token}` } });
        if (res.ok) {
          const data = await res.json();
          fileSha = data.sha;
        }
      } catch(e){}

      try {
        const payload = {
          message: "코드 스니펫 업데이트",
          content: btoa(unescape(encodeURIComponent(JSON.stringify(snippets, null, 2))))
        };
        if (fileSha) payload.sha = fileSha;

        const putRes = await fetch(API_URL, {
          method: "PUT",
          headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (putRes.ok) {
          const resData = await putRes.json();
          fileSha = resData.content.sha;
          return true;
        } else {
          alert("저장 권한 오류.");
          return false;
        }
      } catch (e) { return false; }
    }

    // ----- 스니펫 조작 -----
    async function saveSnippet() {
      const title = document.getElementById("snip-title").value.trim();
      const category = document.getElementById("snip-category").value;
      const code = document.getElementById("snip-code").value.trim();
      
      if (!title || !code) return alert("제목과 코드 내용을 모두 입력하세요.");

      const btn = document.getElementById("btn-save");
      btn.innerText = "저장 중...";
      btn.disabled = true;

      if (editingId) {
        const item = snippets.find(s => s.id === editingId);
        if (item) {
          item.title = title;
          item.category = category;
          item.code = code;
          item.updatedAt = Date.now();
        }
      } else {
        snippets.push({
          id: Date.now(),
          title: title,
          category: category,
          code: code,
          createdAt: Date.now(),
          updatedAt: Date.now()
        });
      }

      const success = await syncToServer();
      if (success) {
        cancelEdit();
        renderSnippets();
      }
      
      btn.innerText = "창고에 저장하기";
      btn.disabled = false;
    }

    function editSnippet(id) {
      const item = snippets.find(s => s.id === id);
      if (!item) return;
      
      editingId = id;
      document.getElementById("form-title").innerText = "스니펫 수정";
      document.getElementById("snip-title").value = item.title;
      document.getElementById("snip-category").value = item.category;
      document.getElementById("snip-code").value = item.code;
      
      document.getElementById("btn-save").innerText = "수정 완료";
      document.getElementById("btn-cancel").style.display = "block";
      
      // 화면 좌측 상단으로 부드럽게 스크롤
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
      editingId = null;
      document.getElementById("form-title").innerText = "새 스니펫 등록";
      document.getElementById("snip-title").value = "";
      document.getElementById("snip-category").value = "VBA";
      document.getElementById("snip-code").value = "";
      
      document.getElementById("btn-save").innerText = "창고에 저장하기";
      document.getElementById("btn-cancel").style.display = "none";
    }

    async function deleteSnippet(id) {
      if (!confirm("이 스니펫을 삭제하시겠습니까?")) return;
      snippets = snippets.filter(s => s.id !== id);
      if (editingId === id) cancelEdit();
      
      renderSnippets();
      await syncToServer();
    }

    // ----- 렌더링 -----
    function renderSnippets() {
      const grid = document.getElementById("snippet-grid");
      const filterCat = document.getElementById("filter-category").value;
      const keyword = document.getElementById("search-keyword").value.toLowerCase();
      
      grid.innerHTML = "";
      
      let filtered = snippets.filter(s => {
        const matchCat = filterCat === "ALL" || s.category === filterCat;
        const matchKey = s.title.toLowerCase().includes(keyword) || s.code.toLowerCase().includes(keyword);
        return matchCat && matchKey;
      });

      // 최신 수정순 정렬
      filtered.sort((a, b) => b.updatedAt - a.updatedAt);

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: #888; padding: 40px; font-weight: bold;">등록된 스니펫이 없습니다.</div>`;
        return;
      }

      filtered.forEach(s => {
        const bgColor = categoryColors[s.category] || categoryColors["기타"];
        
        // HTML 이스케이프 처리 (코드 안전 출력)
        const safeCode = s.code.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        
        grid.innerHTML += `
          <div class="snippet-card">
            <div class="card-header">
              <h4 class="card-title">
                <span class="category-badge" style="background-color: ${bgColor};">${s.category}</span>
                ${s.title}
              </h4>
            </div>
            <div class="card-body">
              <button class="btn-copy-code" onclick="copyCode(this, ${s.id})" title="코드 복사">📋 Copy</button>
              <pre class="code-display" id="code-${s.id}"><code>${safeCode}</code></pre>
            </div>
            <div class="card-footer">
              <button class="btn-edit" onclick="editSnippet(${s.id})">수정</button>
              <button class="btn-delete" onclick="deleteSnippet(${s.id})">삭제</button>
            </div>
          </div>
        `;
      });
    }

    // ----- 복사 기능 -----
    function copyCode(btnEl, id) {
      const codeEl = document.getElementById(`code-${id}`);
      const textToCopy = codeEl.innerText;
      
      navigator.clipboard.writeText(textToCopy).then(() => {
        // 버튼 UI 임시 변경
        const originalText = btnEl.innerHTML;
        btnEl.innerHTML = "✔️ Copied!";
        btnEl.classList.add("copied");
        
        showToast();
        
        setTimeout(() => {
          btnEl.innerHTML = originalText;
          btnEl.classList.remove("copied");
        }, 2000);
      });
    }

    function showToast() {
      const toast = document.getElementById("toast");
      toast.className = "show";
      setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
    }

    // ----- 모달 -----
    function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; fetchData(); }

    fetchData();
  </script>
</body>
</html>
