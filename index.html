<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나만의 AI 비서 (Gemini)</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 20px; background-color: #f4f7f6; color: #333; height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; }
    
    /* 헤더 영역 */
    .header-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 2px solid #ddd; flex-shrink: 0; }
    .header-area h1 { margin: 0; font-size: 22px; color: #1a73e8; display: flex; align-items: center; gap: 10px; }
    .header-btns { display: flex; gap: 10px; }
    .btn-clear { background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; }
    .btn-clear:hover { background: #c82333; }
    .btn-setting { background: #6c757d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; }
    .btn-setting:hover { background: #5a6268; }

    /* 채팅 영역 */
    .chat-container { flex: 1; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #ddd; }
    .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background: #f8f9fa; }
    
    .message { display: flex; flex-direction: column; max-width: 75%; line-height: 1.5; font-size: 14px; position: relative; }
    .message.user { align-self: flex-end; align-items: flex-end; }
    .message.model { align-self: flex-start; align-items: flex-start; }
    
    .bubble { padding: 12px 16px; border-radius: 12px; word-break: break-all; white-space: pre-wrap; }
    .user .bubble { background: #1a73e8; color: white; border-bottom-right-radius: 2px; }
    .model .bubble { background: white; border: 1px solid #ddd; color: #333; border-bottom-left-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    
    .role-label { font-size: 11px; font-weight: bold; color: #888; margin-bottom: 4px; padding: 0 4px; }
    
    /* 로딩 애니메이션 */
    .loading-dots { display: flex; gap: 4px; padding: 5px; }
    .dot { width: 6px; height: 6px; background: #888; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

    /* 입력 영역 */
    .input-area { display: flex; gap: 10px; padding: 15px; background: white; border-top: 1px solid #eee; }
    .chat-input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; resize: none; font-family: inherit; height: 24px; }
    .btn-send { background: #28a745; color: white; border: none; padding: 0 25px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    .btn-send:hover { background: #218838; }
    .btn-send:disabled { background: #999; cursor: not-allowed; }

    /* 설정 모달 */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 25px; border-radius: 10px; width: 340px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    .modal-content h3 { margin: 0 0 5px 0; }
    .modal-content label { font-weight: bold; font-size: 0.9em; color: #555; }
    .modal-content input, .modal-content textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; margin-top: 3px; font-family: inherit; }
    .btn-group { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
    .system-prompt-guide { font-size: 11px; color: #666; margin-top: -10px; line-height: 1.4; }
  </style>
</head>
<body>

  <div class="header-area">
    <h1>✨ 나만의 AI 비서 (Gemini)</h1>
    <div class="header-btns">
      <button class="btn-clear" onclick="clearChat()">🗑️ 대화 초기화</button>
      <button class="btn-setting" onclick="openSettings()">⚙️ API 설정</button>
    </div>
  </div>

  <div class="chat-container">
    <div class="chat-box" id="chat-box">
      <!-- 안내 메시지 -->
      <div class="message model">
        <div class="role-label">Gemini 비서</div>
        <div class="bubble">안녕하세요! 우측 상단의 [⚙️ API 설정]에서 구글 Gemini API Key를 입력하시면 저와 대화를 시작할 수 있습니다. 
(※ AI Studio에서 무료로 발급받은 키를 사용하세요. 사내 보안을 위해 회사 기밀 데이터는 입력하지 않도록 주의해 주세요!)</div>
      </div>
    </div>
    
    <div class="input-area">
      <textarea id="chat-input" class="chat-input" placeholder="질문을 입력하세요... (Enter 키로 전송, Shift+Enter로 줄바꿈)" onkeydown="handleEnter(event)"></textarea>
      <button id="btn-send" class="btn-send" onclick="sendMessage()">전송</button>
    </div>
  </div>

  <!-- 설정 모달 -->
  <div id="settings-modal" class="modal">
    <div class="modal-content">
      <h3 style="margin-top:0;">⚙️ Gemini API 연동 설정</h3>
      <div>
        <label>🔑 Gemini API Key</label>
        <input type="password" id="gemini-key" placeholder="AIzaSy..." oninput="localStorage.setItem('gemini_api_key', this.value)">
      </div>
      <div>
        <label>🛠️ AI 성격 부여 (System Instruction)</label>
        <textarea id="system-prompt" rows="3" oninput="localStorage.setItem('ai_system_prompt', this.value)">당신은 삼성전자 반도체 엔지니어를 돕는 유능하고 친절한 AI 비서입니다. 답변은 항상 한국어로 핵심만 간결하게 작성하세요.</textarea>
      </div>
      <p class="system-prompt-guide">API 키는 브라우저에만 안전하게 저장되며 외부로 유출되지 않습니다.</p>
      <div class="btn-group">
        <button onclick="closeSettings()" style="background:#1a73e8; color:white; border:none; padding:8px 15px; border-radius:4px; font-weight:bold; cursor:pointer;">확인 및 닫기</button>
      </div>
    </div>
  </div>

  <script>
    // ----- 로컬 스토리지 데이터 불러오기 -----
    const savedKey = localStorage.getItem("gemini_api_key");
    const savedPrompt = localStorage.getItem("ai_system_prompt");
    let chatHistory = JSON.parse(localStorage.getItem("gemini_chat_history")) || [];

    if (savedKey) document.getElementById("gemini-key").value = savedKey;
    if (savedPrompt) {
      document.getElementById("system-prompt").value = savedPrompt;
    } else {
      localStorage.setItem('ai_system_prompt', document.getElementById("system-prompt").value);
    }

    const chatBox = document.getElementById("chat-box");
    const inputEl = document.getElementById("chat-input");
    const btnSend = document.getElementById("btn-send");

    // ----- 초기 화면 렌더링 -----
    function initChat() {
      if (chatHistory.length > 0) {
        chatBox.innerHTML = ""; 
        chatHistory.forEach(msg => appendMessageUI(msg.role, msg.parts[0].text));
        scrollToBottom();
      }
    }
    initChat();

    // ----- UI 조작 함수 -----
    function appendMessageUI(role, content) {
      const msgDiv = document.createElement("div");
      // Gemini API는 역할이 'user'와 'model'로 구분됩니다.
      msgDiv.className = `message ${role === 'user' ? 'user' : 'model'}`;
      
      const label = role === 'user' ? '나' : 'Gemini 비서';
      
      msgDiv.innerHTML = `
        <div class="role-label">${label}</div>
        <div class="bubble">${content}</div>
      `;
      chatBox.appendChild(msgDiv);
    }

    function scrollToBottom() {
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleEnter(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    // ----- Gemini API 통신 로직 -----
    async function sendMessage() {
      const text = inputEl.value.trim();
      const apiKey = localStorage.getItem("gemini_api_key");
      
      if (!text) return;
      if (!apiKey) {
        alert("우측 상단 [⚙️ API 설정]에서 구글 Gemini API Key를 먼저 입력해 주세요.");
        openSettings();
        return;
      }

      // 1. 사용자 메시지 화면에 표시 및 저장 (Gemini 규격에 맞게 저장)
      inputEl.value = "";
      appendMessageUI('user', text);
      chatHistory.push({ role: "user", parts: [{ text: text }] });
      saveHistory();
      scrollToBottom();
      
      inputEl.disabled = true;
      btnSend.disabled = true;
      btnSend.innerText = "답변 중...";

      // 2. 로딩 애니메이션
      const loadingDiv = document.createElement("div");
      loadingDiv.className = "message model";
      loadingDiv.id = "loading-bubble";
      loadingDiv.innerHTML = `
        <div class="role-label">Gemini 비서</div>
        <div class="bubble">
          <div class="loading-dots">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
          </div>
        </div>
      `;
      chatBox.appendChild(loadingDiv);
      scrollToBottom();

      // 3. Gemini API 전송 데이터 준비
      const systemPrompt = localStorage.getItem("ai_system_prompt") || "당신은 유능한 어시스턴트입니다.";

      try {
        // Gemini 1.5 Flash 모델 엔드포인트 호출
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            system_instruction: {
              parts: { text: systemPrompt }
            },
            contents: chatHistory
          })
        });

        document.getElementById("loading-bubble").remove();

        if (response.ok) {
          const data = await response.json();
          // Gemini API의 응답 텍스트 추출 경로
          const aiResponseText = data.candidates[0].content.parts[0].text;
          
          appendMessageUI('model', aiResponseText);
          chatHistory.push({ role: "model", parts: [{ text: aiResponseText }] });
          saveHistory();
        } else {
          const errorData = await response.json();
          appendMessageUI('model', `⚠️ 오류가 발생했습니다.\nAPI 키가 유효한지 확인해 주세요. 상세: ${errorData.error?.message || '알 수 없는 오류'}`);
        }
      } catch (error) {
        document.getElementById("loading-bubble").remove();
        appendMessageUI('model', `🚫 네트워크 연결에 실패했습니다.\n사내 방화벽이 외부 API 호출(googleapis.com)을 차단했을 수 있습니다.`);
        console.error(error);
      } finally {
        inputEl.disabled = false;
        btnSend.disabled = false;
        btnSend.innerText = "전송";
        inputEl.focus();
        scrollToBottom();
      }
    }

    function saveHistory() {
      localStorage.setItem("gemini_chat_history", JSON.stringify(chatHistory));
    }

    function clearChat() {
      if (confirm("대화 기록을 모두 지우시겠습니까?")) {
        chatHistory = [];
        localStorage.removeItem("gemini_chat_history");
        chatBox.innerHTML = `
          <div class="message model">
            <div class="role-label">Gemini 비서</div>
            <div class="bubble">대화 기록이 초기화되었습니다. 무엇을 도와드릴까요?</div>
          </div>
        `;
      }
    }

    function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }
  </script>
</body>
</html>
