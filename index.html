<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Work Portal</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 0; background-color: #f0f2f5; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    /* 상단 헤더 */
    .header { width: 100%; max-width: 800px; padding: 30px 20px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: flex-end; }
    .header h1 { margin: 0; font-size: 28px; color: #333; letter-spacing: -0.5px; }
    .header h1 span { color: #1a73e8; }
    .btn-setting { background: #fff; color: #555; border: 1px solid #ccc; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: bold; transition: all 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .btn-setting:hover { background: #f8f9fa; border-color: #aaa; color: #333; }

    /* 포털 그리드 레이아웃 (3x3) */
    .portal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; width: 100%; max-width: 700px; padding: 20px; box-sizing: border-box; }
    
    /* 개별 아이콘 카드 */
    .app-card { background: white; border-radius: 16px; padding: 25px 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: #333; box-shadow: 0 4px 10px rgba(0,0,0,0.04); transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; position: relative; user-select: none; }
    .app-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
    
    .app-icon { font-size: 45px; margin-bottom: 12px; transition: transform 0.2s; }
    .app-card:hover .app-icon { transform: scale(1.1); }
    .app-name { font-size: 15px; font-weight: bold; text-align: center; word-break: keep-all; }
    
    /* 비어있는 슬롯 스타일 */
    .app-card.empty { background: #e9ecef; border: 2px dashed #ced4da; box-shadow: none; color: #888; }
    .app-card.empty:hover { border-color: #adb5bd; background: #e2e6ea; }
    .app-card.empty .app-icon { font-size: 30px; filter: grayscale(100%); opacity: 0.5; }

    /* 우클릭 유도 안내 문구 */
    .guide-text { margin-top: 40px; font-size: 13px; color: #888; text-align: center; }

    /* 공통 모달 스타일 */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(3px); }
    .modal-content { background: white; padding: 25px 30px; border-radius: 12px; width: 320px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .modal-content h3 { margin: 0 0 5px 0; color: #333; font-size: 18px; }
    .modal-content label { font-weight: bold; font-size: 12px; color: #666; margin-bottom: -5px; }
    .modal-content input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; transition: border-color 0.2s; }
    .modal-content input:focus { outline: none; border-color: #1a73e8; }
    
    .btn-group { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
    .btn-modal { padding: 8px 16px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 13px; }
    .btn-cancel { background: #e9ecef; color: #555; }
    .btn-cancel:hover { background: #dde2e6; }
    .btn-save { background: #1a73e8; color: white; }
    .btn-save:hover { background: #1557b0; }
    .btn-reset { background: #dc3545; color: white; margin-right: auto; }
  </style>
</head>
<body>

  <div class="header">
    <h1>My <span>Work Portal</span></h1>
    <button class="btn-setting" onclick="openSettingsModal()">⚙️ 동기화 설정</button>
  </div>

  <!-- 9개의 아이콘이 들어갈 그리드 영역 -->
  <div class="portal-grid" id="portal-grid"></div>
  
  <div class="guide-text">
    🖱️ <b>좌클릭</b>: 이동하기 &nbsp;|&nbsp; 🖱️ <b>우클릭</b>: 이름 및 링크 수정
  </div>

  <!-- 링크 수정 모달 -->
  <div id="edit-modal" class="modal">
    <div class="modal-content">
      <h3>바로가기 수정</h3>
      <input type="hidden" id="edit-index">
      
      <label>이모지 (아이콘)</label>
      <input type="text" id="edit-icon" placeholder="예: 📅, 🏢, ✉️" maxlength="2">
      
      <label>바로가기 이름</label>
      <input type="text" id="edit-name" placeholder="예: 팀 캘린더">
      
      <label>접속 URL 주소</label>
      <input type="text" id="edit-url" placeholder="예: calendar.html 또는 https://...">
      
      <div class="btn-group">
        <button class="btn-modal btn-reset" onclick="resetSlot()">초기화</button>
        <button class="btn-modal btn-cancel" onclick="closeModal('edit-modal')">취소</button>
        <button class="btn-modal btn-save" id="btn-save-link" onclick="saveLink()">적용</button>
      </div>
    </div>
  </div>

  <!-- 토큰 설정 모달 -->
  <div id="settings-modal" class="modal">
    <div class="modal-content">
      <h3>⚙️ 환경 설정</h3>
      <label>🔑 깃허브 관리자 토큰</label>
      <input type="password" id="github-token" placeholder="github_pat_..." oninput="localStorage.setItem('calendar_github_token', this.value)">
      <p style="font-size:12px; color:#888; margin: 0;">※ 입력 시 바탕화면 배치가 클라우드에 동기화됩니다.</p>
      
      <div class="btn-group">
        <button class="btn-modal btn-save" onclick="closeSettingsModal()">확인 및 닫기</button>
      </div>
    </div>
  </div>

  <script>
    const REPO = "sol8923/sh23.github.io";
    const FILE_PATH = "portal_links.json"; 
    const API_URL = `https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`;
    const RAW_URL = `https://raw.githubusercontent.com/${REPO}/main/${FILE_PATH}`;

    let fileSha = null;

    // 9개의 슬롯 기본 세팅 (배열 길이 고정)
    const defaultLinks = [
      { name: "팀 캘린더", url: "calendar.html", icon: "📅" },
      { name: "개인 비서", url: "todo.html", icon: "💼" },
      { name: "", url: "", icon: "" },
      { name: "", url: "", icon: "" },
      { name: "", url: "", icon: "" },
      { name: "", url: "", icon: "" },
      { name: "", url: "", icon: "" },
      { name: "", url: "", icon: "" },
      { name: "", url: "", icon: "" }
    ];

    let portalData = [...defaultLinks];

    const savedToken = localStorage.getItem("calendar_github_token");
    if (savedToken) document.getElementById("github-token").value = savedToken;

    // ----- 데이터 로딩 및 동기화 -----
    async function fetchData() {
      let isLoaded = false;
      const token = document.getElementById("github-token").value;
      
      if (token) {
        try {
          const res = await fetch(API_URL + "?t=" + new Date().getTime(), { headers: { "Authorization": `token ${token}` } });
          if (res.ok) {
            const data = await res.json();
            fileSha = data.sha;
            const parsed = JSON.parse(decodeURIComponent(escape(atob(data.content))));
            // 9개 배열 크기 보정
            portalData = parsed.length === 9 ? parsed : [...parsed, ...defaultLinks].slice(0, 9);
            isLoaded = true;
          } else if (res.status === 404) {
            portalData = [...defaultLinks];
            fileSha = null;
            isLoaded = true;
          }
        } catch (e) {}
      }

      if (!isLoaded) {
        try {
          const rawRes = await fetch(RAW_URL + "?t=" + new Date().getTime());
          if (rawRes.ok) {
            const parsed = await rawRes.json();
            portalData = parsed.length === 9 ? parsed : [...parsed, ...defaultLinks].slice(0, 9);
          }
        } catch (e) {}
      }
      renderGrid();
    }

    async function syncToServer() {
      const token = document.getElementById("github-token").value;
      if (!token) return; // 토큰이 없으면 현재 PC(메모리)에만 유지됨

      try {
        const res = await fetch(API_URL + "?t=" + new Date().getTime(), { headers: { "Authorization": `token ${token}` } });
        if (res.ok) {
          const data = await res.json();
          fileSha = data.sha;
        }
      } catch(e){}

      try {
        const payload = {
          message: "포털 링크 설정 업데이트",
          content: btoa(unescape(encodeURIComponent(JSON.stringify(portalData, null, 2))))
        };
        if (fileSha) payload.sha = fileSha;

        const putRes = await fetch(API_URL, {
          method: "PUT",
          headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (putRes.ok) {
          const resData = await putRes.json();
          fileSha = resData.content.sha;
        }
      } catch (e) {}
    }

    // ----- UI 렌더링 -----
    function renderGrid() {
      const grid = document.getElementById("portal-grid");
      grid.innerHTML = "";

      portalData.forEach((item, index) => {
        const isEmpty = !item.name && !item.url;
        const iconHtml = isEmpty ? "➕" : (item.icon || "🔗");
        const nameHtml = isEmpty ? "빈 슬롯" : item.name;
        
        const card = document.createElement("div");
        card.className = `app-card ${isEmpty ? "empty" : ""}`;
        card.innerHTML = `
          <div class="app-icon">${iconHtml}</div>
          <div class="app-name">${nameHtml}</div>
        `;

        // 좌클릭 이벤트 (이동)
        card.addEventListener("click", () => {
          if (isEmpty) {
            openEditModal(index);
          } else {
            // 외부 링크면 새 창, 내부(.html)면 현재 창 이동 옵션 적용
            if (item.url.startsWith("http")) {
              window.open(item.url, '_blank');
            } else {
              window.location.href = item.url;
            }
          }
        });

        // 우클릭 이벤트 (수정 팝업)
        card.addEventListener("contextmenu", (e) => {
          e.preventDefault(); // 브라우저 기본 우클릭 메뉴 차단
          openEditModal(index);
        });

        grid.appendChild(card);
      });
    }

    // ----- 편집 기능 -----
    function openEditModal(index) {
      const item = portalData[index];
      document.getElementById("edit-index").value = index;
      document.getElementById("edit-icon").value = item.icon || "";
      document.getElementById("edit-name").value = item.name || "";
      document.getElementById("edit-url").value = item.url || "";
      
      document.getElementById("edit-modal").style.display = "flex";
      document.getElementById("edit-name").focus();
    }

    async function saveLink() {
      const btn = document.getElementById("btn-save-link");
      btn.innerText = "저장 중...";
      btn.disabled = true;

      const index = parseInt(document.getElementById("edit-index").value);
      const newIcon = document.getElementById("edit-icon").value.trim();
      const newName = document.getElementById("edit-name").value.trim();
      const newUrl = document.getElementById("edit-url").value.trim();

      portalData[index] = {
        name: newName,
        url: newUrl,
        icon: newIcon || "🔗" 
      };

      renderGrid();
      await syncToServer();

      btn.innerText = "적용";
      btn.disabled = false;
      closeModal('edit-modal');
    }

    async function resetSlot() {
      const index = parseInt(document.getElementById("edit-index").value);
      portalData[index] = { name: "", url: "", icon: "" };
      
      renderGrid();
      await syncToServer();
      closeModal('edit-modal');
    }

    // ----- 모달 제어 -----
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function openSettingsModal() { document.getElementById('settings-modal').style.display = 'flex'; }
    function closeSettingsModal() { 
      document.getElementById('settings-modal').style.display = 'none'; 
      fetchData(); 
    }

    // 시작 시 데이터 로드
    fetchData();
  </script>
</body>
</html>
